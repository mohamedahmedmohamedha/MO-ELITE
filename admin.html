<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>VORTEX STUDY — لوحة الإدارة</title><style>:root{--bg:#050816;--card:#0d1628;--card2:#13213a;--text:#f7f9ff;--muted:#91a0bb;--accent:#8d6bff;--accent2:#37d7ff;--ok:#46e0a4;--bad:#ff6f86;--warn:#ffca62;--line:#243552;--shadow:0 20px 60px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0%,rgba(141,107,255,.26),transparent 30%),radial-gradient(circle at 88% 18%,rgba(55,215,255,.12),transparent 28%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.hero h1{margin:3px 0}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.input{font:inherit;border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:var(--card2);color:var(--text)}.btn{cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),#b08cff 55%,var(--accent2));border:0;box-shadow:0 12px 30px rgba(118,99,255,.28)}.good{background:#102b22;border-color:#2e765e}.bad{background:#351923;border-color:#6e3341}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(180deg,rgba(16,27,47,.96),rgba(10,18,32,.96));border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow)}.wide{grid-column:span 4}.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px}.pager .btn:disabled{opacity:.45;cursor:not-allowed}.countline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}.select{min-width:110px}.big{font-size:30px;font-weight:900;margin-top:6px}.ok{color:var(--ok)}.badtxt{color:var(--bad)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input{min-width:260px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;background:#1c2940}.gate{position:fixed;inset:0;background:rgba(5,8,14,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.box{width:min(500px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:25px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input{width:100%;font:inherit;padding:11px;border-radius:12px;border:1px solid var(--line);background:#0b1320;color:var(--text)}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#121e31;border:1px solid var(--line);border-radius:16px;padding:12px}.mini b{display:block;font-size:20px;margin-top:3px}.detail-block{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#0b1424}.detail-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.detail-list div{padding:9px 10px;background:#101d31;border:1px solid var(--line);border-radius:12px}.detail-list strong{display:block;margin-bottom:3px}@media(max-width:560px){.detail-list{grid-template-columns:1fr}}.modal{position:fixed;inset:0;background:rgba(2,5,10,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:15}.modal.show{display:flex}.modal-box{width:min(850px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:25px;padding:20px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.detail-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.detail-grid{grid-template-columns:1fr}.input{min-width:100%}.hero{flex-direction:column}}</style><script src="./firebase-config.js"></script><script>window.VORTEX_DATA_COLLECTION='vortex_study_users_reset_2026';</script><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./vortex-study-logo.svg" type="image/svg+xml"></head><body><div id="gate" class="gate"><div class="box"><div class="muted">VORTEX STUDY • لوحة التحكم</div><h2>لوحة الإدارة</h2><p class="muted">هذا الحساب مخصص لإدارة البرنامج.</p><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" value="mohamedhamed_2022@icloud.com" readonly autocomplete="username"></div><div class="field"><label>رمز الدخول</label><input id="password" type="password" autocomplete="current-password" placeholder="اكتب رمز الدخول"></div><div class="actions"><button id="login" class="btn primary">تسجيل الدخول</button></div><p id="gateMsg" class="muted"></p></div></div><main class="wrap"><header class="hero"><div><div class="muted">VORTEX STUDY · © 2026</div><h1>VORTEX STUDY — لوحة التحكم</h1><div id="meta" class="muted">إدارة الحسابات والبيانات</div></div><div class="actions"><button id="refresh" class="btn">تحديث</button><button id="logout" class="btn">تسجيل الخروج</button></div></header><section class="grid"><div class="card"><div class="muted">إجمالي الحسابات</div><div id="count" class="big">—</div></div><div class="card"><div class="muted">نشطة</div><div id="active" class="big ok">—</div></div><div class="card"><div class="muted">موقوفة</div><div id="suspended" class="big badtxt">—</div></div><div class="card"><div class="muted">آخر تحديث</div><div id="sync" class="big">—</div></div><div class="card wide"><div class="toolbar"><input id="search" class="input" placeholder="بحث بالاسم أو البريد الإلكتروني"><select id="pageSize" class="input select"><option value="25">25 لكل صفحة</option><option value="50" selected>50 لكل صفحة</option><option value="100">100 لكل صفحة</option><option value="250">250 لكل صفحة</option></select><span id="hint" class="muted"></span></div><div class="countline"><strong id="listCount">—</strong><span class="muted">حساب ظاهر في القائمة</span></div><div class="table-wrap"><table class="table"><thead><tr><th>المستخدم</th><th>البريد</th><th>الحالة</th><th>آخر ظهور</th><th>إدارة</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager" class="pager"></div></div></section></main><div id="modal" class="modal"><div class="modal-box"><button id="close" class="btn">إغلاق</button><div id="detail"></div></div></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script><script>
(() => {
  const msg = document.getElementById('gateMsg');
  const emailEl = document.getElementById('email');
  const passEl = document.getElementById('password');
  const gate = document.getElementById('gate');
  const rowsEl = document.getElementById('rows');
  const searchEl = document.getElementById('search');
  const detailEl = document.getElementById('detail');
  const modal = document.getElementById('modal');
  const adminEmail = 'mohamedhamed_2022@icloud.com';

  if (!window.firebase || !window.MOELITE_FIREBASE_CONFIG) {
    msg.textContent = 'تعذر تحميل إعدادات Firebase.'; return;
  }
  if (!firebase.apps.length) firebase.initializeApp(window.MOELITE_FIREBASE_CONFIG);
  const auth = firebase.auth();
  const db = firebase.firestore();
  try { auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch {}

  let users = [];
  let profileMap = new Map();
  let unsubscribeUsers = null;
  let page = 1;
  let pageSize = 50;
  let renderTimer = 0;
  let syncInFlight = false;

  const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const nice = v => { if (!v) return '—'; if (v?.toDate) return v.toDate().toLocaleString('ar-EG'); const d=new Date(v); return Number.isNaN(d.getTime())?'—':d.toLocaleString('ar-EG'); };
  const providerLabel = ids => (Array.isArray(ids) ? ids : []).map(x => ({password:'Email/Password',google:'Google',apple:'Apple'}[x] || x)).join(' · ') || '—';
  const friendly = e => {
    const c = e?.code || '';
    if (c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found') return 'بيانات الدخول غير صحيحة.';
    if (c==='auth/too-many-requests') return 'محاولات كثيرة. انتظر قليلًا ثم أعد المحاولة.';
    if (c==='auth/network-request-failed') return 'تعذر الاتصال بالإنترنت.';
    if (c==='functions/not-found'||c==='functions/unavailable') return 'تعذر تحديث قائمة الحسابات الآن. حاول مرة أخرى بعد قليل.';
    return e?.message || 'تعذر تنفيذ العملية الآن.';
  };
  const setHint = (s) => document.getElementById('hint').textContent = s;
  const stamp = () => document.getElementById('sync').textContent = new Date().toLocaleTimeString('ar-EG');
  function scheduleRender(){ clearTimeout(renderTimer); renderTimer=setTimeout(render,35); }

  async function verifyAdmin(u) {
    return !!u && String(u.email||'').toLowerCase() === adminEmail;
  }
  function stopLiveUsers(){ if(unsubscribeUsers){try{unsubscribeUsers()}catch{} unsubscribeUsers=null;} }

  function mergeUsers(list){
    const map=new Map();
    for(const u of list||[]) map.set(u.id, {...(profileMap.get(u.id)||{}), ...u});
    for(const [id,p] of profileMap) if(!map.has(id)) map.set(id,p);
    users=[...map.values()].sort((a,b)=>String(a.displayName||a.email||'').localeCompare(String(b.displayName||b.email||''),'ar'));
  }

  function startLiveProfiles(){
    stopLiveUsers();
    unsubscribeUsers = db.collection(window.VORTEX_DATA_COLLECTION).onSnapshot(snap=>{
      profileMap = new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
      // Firestore is the instant/live source; preserve Authentication inventory when available.
      mergeUsers(users.length ? users : [...profileMap.values()]);
      scheduleRender(); stamp();
      setHint(syncInFlight ? `متصل • ${users.length} حساب • جاري تحديث البيانات…` : `متصل • ${users.length} حساب`);
    },e=>{
      console.error('profile live failed',e);
      setHint('تعذر الاتصال ببيانات الحسابات.');
      document.getElementById('sync').textContent='فشل';
    });
  }

  async function syncAuthInventory(){
    if(syncInFlight || !auth.currentUser) return false;
    syncInFlight=true; setHint('جاري مزامنة كل الحسابات…');
    try{
      const region = window.MOELITE_FUNCTIONS_REGION || 'us-central1';
      const functions = firebase.app().functions(region);
      const fn = functions.httpsCallable('listVortexAccounts');
      const result = await Promise.race([
        fn({}),
        new Promise((_, reject)=>setTimeout(()=>reject(Object.assign(new Error('sync timeout'),{code:'functions/deadline-exceeded'})),15000))
      ]);
      const list=Array.isArray(result?.data?.users)?result.data.users:[];
      if(!list.length && result?.data?.total>0) throw Object.assign(new Error('Invalid sync payload'),{code:'functions/internal'});
      mergeUsers(list);
      scheduleRender(); stamp(); setHint(`تمت المزامنة • ${users.length} حساب • مباشر`);
      return true;
    }catch(e){
      console.error('auth inventory sync failed',e);
      scheduleRender(); stamp();
      // Firestore remains the live source; Authentication inventory failure must never blank the dashboard.
      setHint(`بيانات Firestore تعمل • مزامنة حسابات Firebase: ${friendly(e)}`);
      return false;
    }finally{syncInFlight=false;}
  }

  async function load(){
    // 1) Instant live Firestore inventory.
    startLiveProfiles();
    // 2) Full Authentication inventory in background.
    await syncAuthInventory();
  }

  function render(){
    const q=searchEl.value.trim().toLowerCase();
    const filtered=users.filter(x=>!q||[x.email,x.displayName,x.id].some(v=>String(v||'').toLowerCase().includes(q)));
    document.getElementById('count').textContent=users.length;
    document.getElementById('active').textContent=users.filter(x=>x.status!=='suspended' && !x.disabled).length;
    document.getElementById('suspended').textContent=users.filter(x=>x.status==='suspended'||x.disabled).length;
    document.getElementById('listCount').textContent=filtered.length;
    const totalPages=Math.max(1,Math.ceil(filtered.length/pageSize)); if(page>totalPages)page=totalPages;
    const start=(page-1)*pageSize, list=filtered.slice(start,start+pageSize);
    if(!list.length){rowsEl.innerHTML='<tr><td colspan="5" style="padding:22px;text-align:center" class="muted">لا توجد حسابات</td></tr>';} else {
      rowsEl.innerHTML=list.map(x=>`<tr>
        <td><strong>${esc(x.displayName||'بدون اسم')}</strong><div class="muted">${esc(x.id)}</div></td>
        <td>${esc(x.email||'—')}</td>
        <td><span class="pill ${x.status==='suspended'||x.disabled?'badtxt':'ok'}">${x.status==='suspended'||x.disabled?'موقوف':'نشط'}</span></td>
        <td>${nice(x.lastSeenAt)}</td>
        <td><button class="btn ${x.status==='suspended'?'good':'bad'}" data-toggle="${esc(x.id)}">${x.status==='suspended'?'إعادة تفعيل':'إيقاف'}</button> <button class="btn" data-view="${esc(x.id)}">تفاصيل</button></td>
      </tr>`).join('');
    }
    rowsEl.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{
      const u=users.find(x=>x.id===b.dataset.toggle); if(!u)return; b.disabled=true;
      try{ const fn=firebase.functions(); const next=u.status==='suspended'?'active':'suspended'; await fn.httpsCallable('setVortexUserStatus')({uid:u.id,status:next}); await load(); }
      catch(e){alert('تعذر تغيير حالة الحساب.'); b.disabled=false;}
    });
    rowsEl.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
    const pager=document.getElementById('pager'); pager.innerHTML='';
    if(totalPages>1){const prev=document.createElement('button');prev.className='btn';prev.textContent='السابق';prev.disabled=page===1;prev.onclick=()=>{page--;render()};const label=document.createElement('span');label.className='muted';label.textContent=`صفحة ${page} من ${totalPages}`;const next=document.createElement('button');next.className='btn';next.textContent='التالي';next.disabled=page===totalPages;next.onclick=()=>{page++;render()};pager.append(prev,label,next);}
  }

  async function view(uid){
    const u=users.find(x=>x.id===uid); if(!u)return; modal.classList.add('show'); detailEl.innerHTML='<p class="muted">جاري تحميل التفاصيل…</p>';
    let state=null; try{const snap=await db.doc(`${window.VORTEX_DATA_COLLECTION}/${uid}/app/state`).get();if(snap.exists){const data=snap.data()||{};try{state=JSON.parse(data.json||'null')}catch{}}}catch(e){console.warn(e)}
    const subjects=Array.isArray(state?.subjects)?state.subjects.length:0,sessions=Array.isArray(state?.focusSessions)?state.focusSessions.length:0,scores=Array.isArray(state?.testGrades)?state.testGrades.length:0,mistakes=Array.isArray(state?.mistakes)?state.mistakes.length:0,seconds=Array.isArray(state?.focusSessions)?state.focusSessions.reduce((a,x)=>a+Math.max(0,Number(x.seconds)||0),0):0;
    const manual=Array.isArray(state?.tasks)?state.tasks.filter(x=>x&&x.source==='manual'):[];
    const manualDone=manual.filter(x=>x.done).length;
    const latestGrade=Array.isArray(state?.testGrades)?state.testGrades.slice().sort((a,b)=>(Number(b.at)||0)-(Number(a.at)||0))[0]:null;
    const latestHistory=Array.isArray(state?.levelHistory)?state.levelHistory.slice().sort((a,b)=>(Number(b.at)||0)-(Number(a.at)||0))[0]:null;
    const profile=state?.profile||{};
    const goal=state?.dailyGoal?.text||'';
    const focusToday=(state?.focusSessions||[]).filter(x=>{const d=new Date(Number(x.at)||0);return d.toISOString().slice(0,10)===new Date().toISOString().slice(0,10)}).reduce((a,x)=>a+Math.max(0,Number(x.seconds)||0),0);
    const subjectLines=(Array.isArray(state?.subjects)?state.subjects:[]).slice(0,20).map(x=>`<div><strong>${esc(x.name||'—')}</strong><span class="muted">${Array.isArray(x.topics)?x.topics.length:0} موضوع · ${Array.isArray(x.questions)?x.questions.length:0} سؤال</span></div>`).join('');
    detailEl.innerHTML=`<h2>${esc(u.displayName||'بدون اسم')}</h2><p class="muted">${esc(u.email||'—')}<br>UID: ${esc(uid)}</p>
      <div class="detail-grid"><div class="mini">الحالة<b>${u.status==='suspended'||u.disabled?'موقوف':'نشط'}</b></div><div class="mini">التحقق<b>${u.emailVerified?'موثّق':'غير موثّق'}</b></div><div class="mini">المزوّد<b style="font-size:14px">${esc(providerLabel(u.providerIds))}</b></div><div class="mini">الصف/المسار<b style="font-size:14px">${esc(profile.grade||'—')} · ${esc(profile.track||'—')}</b></div><div class="mini">المواد<b>${u.metrics?.subjectCount??subjects}</b></div><div class="mini">جلسات التركيز<b>${u.metrics?.sessionCount??sessions}</b></div><div class="mini">الاختبارات<b>${u.metrics?.examCount??scores}</b></div><div class="mini">الأخطاء<b>${u.metrics?.mistakeCount??mistakes}</b></div><div class="mini">وقت التركيز<b>${Math.round((u.metrics?.focusSeconds??seconds)/3600*100)/100} س</b></div><div class="mini">المستوى<b>${u.metrics?.levelScore??'—'}</b></div><div class="mini">الاستعداد<b>${u.metrics?.readinessScore??'—'}</b></div><div class="mini">إنشاء الحساب<b>${nice(u.createdAt)}</b></div></div>
      <div class="detail-block"><strong>ملخص البيانات المتزامنة</strong><div class="detail-list" style="margin-top:10px"><div><strong>الهدف اليومي</strong><span>${esc(goal||'غير محدد')}</span></div><div><strong>إنجاز الخطة</strong><span>${manualDone}/${manual.length} مهمة</span></div><div><strong>تركيز اليوم</strong><span>${Math.round(focusToday/60)} دقيقة</span></div><div><strong>آخر نتيجة اختبار</strong><span>${latestGrade?esc(`${latestGrade.subject||'—'} · ${latestGrade.obtained}/${latestGrade.total} · ${latestGrade.date||''}`):'—'}</span></div><div><strong>آخر قياس مستوى</strong><span>${latestHistory?esc(`${Math.round(latestHistory.score||0)}% · ${latestHistory.date||''}`):'—'}</span></div><div><strong>بيانات الذكاء</strong><span>${state?.diagnostic&&Object.keys(state.diagnostic).length?'متاحة':'لا توجد بعد'}</span></div></div></div>
      <div class="detail-block"><strong>المواد المسجلة</strong><div class="detail-list" style="margin-top:10px">${subjectLines||'<div>لا توجد مواد.</div>'}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn primary" id="resetUserPassword">إرسال رابط تغيير كلمة المرور</button><button class="btn ${u.status==='suspended'?'good':'bad'}" id="toggleFromDetail">${u.status==='suspended'?'إعادة تفعيل الحساب':'إيقاف الحساب'}</button></div><p class="muted" style="margin-top:14px">آخر ظهور: ${nice(u.lastSeenAt)} · البيانات تُقرأ مباشرة من Firestore</p>`;
    document.getElementById('resetUserPassword').onclick=async()=>{if(!u.email)return alert('لا يوجد بريد إلكتروني للحساب.');try{await auth.sendPasswordResetEmail(u.email);alert('تم إرسال رابط إعادة تعيين كلمة المرور.')}catch(e){alert('تعذر إرسال الرابط: '+friendly(e))}};
    document.getElementById('toggleFromDetail').onclick=async()=>{const next=u.status==='suspended'?'active':'suspended';try{await firebase.functions().httpsCallable('setVortexUserStatus')({uid,status:next});modal.classList.remove('show');await load()}catch(e){alert('تعذر تغيير حالة الحساب.')} };
  }

  async function doAdminLogin(){
    if(!passEl.value||syncInFlight)return setGateMsg('اكتب رمز الدخول.','badtxt');
    const btn=document.getElementById('login'); btn.disabled=true; passEl.disabled=true; msg.textContent='جاري التحقق…';
    try{await auth.signInWithEmailAndPassword(adminEmail,passEl.value);passEl.value='';}
    catch(e){console.error(e);msg.textContent=friendly(e);msg.className='muted badtxt';}
    finally{btn.disabled=false;passEl.disabled=false;}
  }
  const setGateMsg=(t,k='')=>{msg.textContent=t;msg.className='muted '+k};
  document.getElementById('login').onclick=doAdminLogin; passEl.onkeydown=e=>{if(e.key==='Enter')doAdminLogin()};
  document.getElementById('logout').onclick=async()=>{stopLiveUsers();try{await auth.signOut()}catch{}};
  document.getElementById('refresh').onclick=()=>{if(auth.currentUser){startLiveProfiles();syncAuthInventory();}};
  searchEl.oninput=()=>{page=1;scheduleRender()}; document.getElementById('pageSize').onchange=e=>{pageSize=Number(e.target.value)||50;page=1;render()};
  document.getElementById('close').onclick=()=>modal.classList.remove('show'); modal.onclick=e=>{if(e.target.id==='modal')modal.classList.remove('show')};

  auth.onAuthStateChanged(async u=>{
    gate.style.display='flex'; stopLiveUsers();
    if(!u){document.getElementById('meta').textContent='إدارة الحسابات والبيانات';return;}
    const ok=await verifyAdmin(u); if(!ok){setGateMsg('هذا الحساب غير مصرح له بالدخول إلى لوحة الأدمن.','badtxt');try{await auth.signOut()}catch{}return;}
    gate.style.display='none'; document.getElementById('meta').textContent='الأدمن: '+u.email; load();
  });
})();
</script></body></html>
