<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>MO ELITE — لوحة الأدمن</title><style>:root{--bg:#070b13;--card:#101827;--card2:#172238;--text:#f2f6ff;--muted:#9aa7bd;--accent:#8e6cff;--ok:#39d39a;--bad:#ff6878;--line:#25334c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(142,108,255,.25),transparent 34%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.hero h1{margin:3px 0}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.input{font:inherit;border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:var(--card2);color:var(--text)}.btn{cursor:pointer}.primary{background:linear-gradient(135deg,#6548ee,#a083ff);border:0}.good{background:#102b22;border-color:#2e765e}.bad{background:#351923;border-color:#6e3341}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:rgba(16,24,39,.94);border:1px solid var(--line);border-radius:22px;padding:17px}.wide{grid-column:span 4}.big{font-size:30px;font-weight:900;margin-top:6px}.ok{color:var(--ok)}.badtxt{color:var(--bad)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input{min-width:260px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;background:#1c2940}.gate{position:fixed;inset:0;background:rgba(5,8,14,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.box{width:min(500px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:25px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input{width:100%;font:inherit;padding:11px;border-radius:12px;border:1px solid var(--line);background:#0b1320;color:var(--text)}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#121e31;border:1px solid var(--line);border-radius:16px;padding:12px}.mini b{display:block;font-size:20px;margin-top:3px}.modal{position:fixed;inset:0;background:rgba(2,5,10,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:15}.modal.show{display:flex}.modal-box{width:min(850px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:25px;padding:20px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.detail-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.detail-grid{grid-template-columns:1fr}.input{min-width:100%}.hero{flex-direction:column}}</style><script src="./firebase-config.js"></script></head><body><div id="gate" class="gate"><div class="box"><div class="muted">MO ELITE • OWNER CONSOLE</div><h2>دخول الأدمن</h2><p class="muted">استخدم حساب الأدمن المخصص للمشروع.</p><div class="field"><label>الإيميل</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>الباسورد</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button id="login" class="btn primary">تسجيل الدخول</button><button id="register" class="btn">إنشاء حساب الأدمن</button></div><p id="gateMsg" class="muted"></p></div></div><main class="wrap"><header class="hero"><div><div class="muted">VORTEX WEBLAB</div><h1>MO ELITE Admin</h1><div id="meta" class="muted">لوحة تحكم الطلاب</div></div><div class="actions"><button id="refresh" class="btn">تحديث</button><button id="logout" class="btn">تسجيل الخروج</button></div></header><section class="grid"><div class="card"><div class="muted">إجمالي الحسابات</div><div id="count" class="big">—</div></div><div class="card"><div class="muted">نشطة</div><div id="active" class="big ok">—</div></div><div class="card"><div class="muted">موقوفة</div><div id="suspended" class="big badtxt">—</div></div><div class="card"><div class="muted">آخر تحديث</div><div id="sync" class="big">—</div></div><div class="card wide"><div class="toolbar"><input id="search" class="input" placeholder="بحث بالاسم أو البريد أو UID"><span id="hint" class="muted"></span></div><div class="table-wrap"><table class="table"><thead><tr><th>المستخدم</th><th>البريد</th><th>الحالة</th><th>آخر ظهور</th><th>إدارة</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><div id="modal" class="modal"><div class="modal-box"><button id="close" class="btn">إغلاق</button><div id="detail"></div></div></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>if(!window.firebase){document.getElementById('gateMsg').textContent='تعذر تحميل خدمة Firebase.';throw new Error('Firebase CDN unavailable')} if(!firebase.apps.length)firebase.initializeApp(window.MOELITE_FIREBASE_CONFIG);const app=firebase.app(),auth=firebase.auth(),db=firebase.firestore(),adminEmail=(window.MOELITE_ADMIN_EMAIL||'').toLowerCase();let users=[];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const msg=document.getElementById('gateMsg');const nice=v=>v?.toDate?v.toDate().toLocaleString('ar-EG'):'—';async function adminOk(u){return !!u&&String(u.email||'').toLowerCase()===adminEmail}async function load(){try{const snap=await db.collection('users').limit(500).get();users=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(b.lastSeenAt?.toMillis?.()||0)-Number(a.lastSeenAt?.toMillis?.()||0));render();document.getElementById('sync').textContent=new Date().toLocaleTimeString('ar-EG')}catch(e){console.error(e);document.getElementById('hint').textContent='تعذر تحميل الحسابات. تحقق من اتصال Firebase وقواعد Firestore.';document.getElementById('rows').innerHTML='<tr><td colspan="5" style="padding:20px;text-align:center" class="muted">تعذر تحميل الحسابات</td></tr>';document.getElementById('sync').textContent='فشل التحديث'}}function render(){const q=document.getElementById('search').value.trim().toLowerCase(),list=users.filter(x=>!q||[x.email,x.displayName,x.id].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('count').textContent=users.length;document.getElementById('active').textContent=users.filter(x=>(x.status||'active')!=='suspended').length;document.getElementById('suspended').textContent=users.filter(x=>x.status==='suspended').length;document.getElementById('hint').textContent=`عرض ${list.length} من ${users.length}`;document.getElementById('rows').innerHTML=list.map(x=>`<tr><td><strong>${esc(x.displayName||'بدون اسم')}</strong><div class="muted">${esc(x.id)}</div></td><td>${esc(x.email||'—')}</td><td><span class="pill ${x.status==='suspended'?'badtxt':'ok'}">${x.status==='suspended'?'موقوف':'نشط'}</span></td><td>${nice(x.lastSeenAt)}</td><td><button class="btn ${x.status==='suspended'?'good':'bad'}" data-toggle="${esc(x.id)}">${x.status==='suspended'?'إعادة تفعيل':'إيقاف'}</button><button class="btn" data-view="${esc(x.id)}">تفاصيل</button></td></tr>`).join('')||'<tr><td colspan="5" style="padding:20px;text-align:center" class="muted">لا توجد حسابات</td></tr>';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const u=users.find(x=>x.id===b.dataset.toggle);if(!u)return;await db.doc('users/'+u.id).set({status:u.status==='suspended'?'active':'suspended',statusChangedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await load()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view))}async function view(uid){const u=users.find(x=>x.id===uid);if(!u)return;document.getElementById('modal').classList.add('show');document.getElementById('detail').innerHTML='<p class="muted">جاري التحميل…</p>';const snap=await db.doc('users/'+uid+'/app/state').get();let s=null;try{s=snap.exists()?JSON.parse(snap.data()?.json||'null'):null}catch{}const subjects=Array.isArray(s?.subjects)?s.subjects.length:0,sessions=Array.isArray(s?.focusSessions)?s.focusSessions.length:0,scores=Array.isArray(s?.scores)?s.scores.length:0,mistakes=Array.isArray(s?.mistakes)?s.mistakes.length:0;const seconds=Array.isArray(s?.focusSessions)?s.focusSessions.reduce((a,x)=>a+Math.max(0,Number(x.seconds)||0),0):0;document.getElementById('detail').innerHTML=`<h2>${esc(u.displayName||'بدون اسم')}</h2><p class="muted">${esc(u.email||'—')}<br>UID: ${esc(uid)}</p><div class="detail-grid"><div class="mini">المواد<b>${subjects}</b></div><div class="mini">جلسات التركيز<b>${sessions}</b></div><div class="mini">الاختبارات<b>${scores}</b></div><div class="mini">الأخطاء<b>${mistakes}</b></div><div class="mini">وقت التركيز<b>${Math.round(seconds/3600*100)/100} س</b></div><div class="mini">الحالة<b>${u.status==='suspended'?'موقوف':'نشط'}</b></div></div><p class="muted" style="margin-top:14px">آخر ظهور: ${nice(u.lastSeenAt)}</p>`}document.getElementById('login').onclick=async()=>{try{const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;await auth.signInWithEmailAndPassword(e,p)}catch(e){msg.textContent='تعذر تسجيل الدخول.'}};document.getElementById('register').onclick=async()=>{try{const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(e.toLowerCase()!==adminEmail){msg.textContent='استخدم إيميل الأدمن المحدد للمشروع.';return}if(p.length<6){msg.textContent='الباسورد 6 أحرف على الأقل.';return}await auth.createUserWithEmailAndPassword(e,p);await db.doc('users/'+auth.currentUser.uid).set({email:e,displayName:'MO ELITE Admin',status:'active',isAdmin:true,createdAt:firebase.firestore.FieldValue.serverTimestamp(),lastSeenAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}catch(e){msg.textContent=e?.code==='auth/email-already-in-use'?'الحساب موجود؛ استخدم تسجيل الدخول.':'تعذر إنشاء حساب الأدمن.'}};document.getElementById('logout').onclick=()=>auth.signOut();document.getElementById('refresh').onclick=load;document.getElementById('search').oninput=render;document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};auth.onAuthStateChanged(async u=>{if(!u||!(await adminOk(u))){document.getElementById('gate').style.display='flex';if(u){msg.textContent='هذا الحساب ليس حساب الأدمن.';try{await auth.signOut()}catch{}}return}await db.doc('users/'+u.uid).set({email:u.email,displayName:u.displayName||'MO ELITE Admin',isAdmin:true,lastSeenAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});document.getElementById('gate').style.display='none';document.getElementById('meta').textContent='الأدمن: '+u.email;await load()});</script></body></html>
